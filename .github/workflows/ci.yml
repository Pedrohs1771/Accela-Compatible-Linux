name: accela-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils p7zip-full rsync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n dev-install.sh
          bash -n publish-update.sh
          bash -n app/ACCELA/squashfs-root/AppRun
          bash -n app/ACCELA/squashfs-root/bin/run.sh
          shellcheck install.sh dev-install.sh publish-update.sh app/ACCELA/squashfs-root/AppRun app/ACCELA/squashfs-root/bin/run.sh

      - name: Validate Python sources
        run: python3 -m compileall app/ACCELA/squashfs-root/bin/src

      - name: Validate requirements in fresh venv
        run: |
          python3 -m venv /tmp/accela-ci-venv
          /tmp/accela-ci-venv/bin/pip install --upgrade pip setuptools wheel
          /tmp/accela-ci-venv/bin/pip install -r app/ACCELA/squashfs-root/bin/requirements.txt
          /tmp/accela-ci-venv/bin/python - <<'PY'
          import importlib
          for module in ("PyQt6", "requests", "bs4", "cachetools"):
              importlib.import_module(module)
          print("deps ok")
          PY

      - name: Validate desktop entry
        run: desktop-file-validate app/ACCELA/squashfs-root/ACCELA.desktop

      - name: Validate latest manifest when present
        run: |
          if [ -f release/latest.json ]; then
            python3 - <<'PY'
            import json
            from pathlib import Path
            json.loads(Path("release/latest.json").read_text(encoding="utf-8"))
            print("latest.json ok")
            PY
          fi
